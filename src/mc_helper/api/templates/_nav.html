{# Needs `page` ("home" or "guide") and `csrf` in scope. Include it inside {% with page="..." %}. #}
<header class="top">
  <a class="brand" href="/">{{ server_name }}</a>
  <nav aria-label="Pages">
    <a class="navlink{% if page == 'home' %} here{% endif %}" href="/"{% if page == 'home' %} aria-current="page"{% endif %}>Home</a>
    <a class="navlink{% if page == 'guide' %} here{% endif %}" href="/friends-guide"{% if page == 'guide' %} aria-current="page"{% endif %}>Get friends playing</a>
  </nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="small quiet">Log out</button>
  </form>
</header>
