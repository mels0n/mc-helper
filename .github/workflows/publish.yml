name: Publish image

# Runs the standards checks, then publishes the image only if they pass.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish.yml'
      - '.github/workflows/standards.yml'
  # Manual run: publish the current main when no push run has (for example when a push did
  # not start the workflow). A commit that already has an image is not rebuilt.
  workflow_dispatch:

permissions:
  contents: read

# One publish per commit at a time: a manual run on the same commit as a push run queues
# behind it instead of racing it. Different commits are not grouped, so none is dropped.
# Never cancelled, so an image push is not cut off halfway.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    # Only main is checked and published here; other branches are checked by pull requests.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/standards.yml

  publish:
    needs: checks
    # Only main is published, also for a manual run started on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # A tag names one image: if this commit was already published, keep that image.
      - name: Check whether the tag exists
        id: exists
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists; not rebuilding."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
