# Compose-format description of the single mc-helper service.
# This file documents the service; it is not deployed as a stack. It matches the
# `docker service create` command in docs/how-to/deploy.md. Create or update the service with
# `docker service create` / `docker service update`, never with `docker stack deploy`.
# Secrets and the network are external: create them first.

services:
  mc-helper:
    image: <image>
    user: "1000:1000"
    environment:
      CONTROL_DIR: /control
      TRUSTED_PROXIES: <proxy-network-subnet>
      COOKIE_SECURE: "true"
      DISPLAY_TIMEZONE: <timezone>
      SERVER_ADDRESS: <game-address>
      BROADCAST_GAMERTAG: <broadcast-gamertag>
      SERVER_DISPLAY_NAME: <display-name>
    secrets:
      - mch_pin
      - mch_session_secret
    volumes:
      - type: bind
        source: <control-path>
        target: /control
    networks:
      - <proxy-network>
    # No published ports: the reverse proxy reaches the app by service name.
    read_only: true
    cap_drop:
      - ALL
    deploy:
      replicas: 1 # login lockout counters live in the process; never scale out
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure

secrets:
  mch_pin:
    external: true
  mch_session_secret:
    external: true

networks:
  <proxy-network>:
    external: true
